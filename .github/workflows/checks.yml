name: checks

# The site's guarantees, enforced on every change rather than when someone
# remembers to run them. Three things are checked, in order of how badly they
# fail if they are wrong:
#
#   1. The robots meta matches the STAGING flag. Shipping staging's noindex to
#      production is the failure with no visible symptom — the site looks
#      perfect and never appears in search.
#   2. The committed HTML matches what build.py generates. The root *.html is
#      output; a hand-edit there, or a forgotten rebuild, is silently lost on
#      the next build.
#   3. The six detectors in tools/audit, against the rendered pages.

on:
  pull_request:
  push:
    branches: [main]

# Read the code; comment on a PR when a third party's photo disappears. Nothing
# here writes to the repository.
permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build (fails on a robots/STAGING mismatch)
        run: python3 tools/build.py

      - name: Committed HTML is in sync with pages/ and build.py
        run: |
          if ! git diff --exit-code; then
            echo "::error::The committed HTML does not match what tools/build.py generates."
            echo "Run 'python3 tools/build.py' and commit the result. Never hand-edit the"
            echo "root *.html — every file starts with a GENERATED banner saying so."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/audit/package-lock.json

      - name: Install the audit's browser
        working-directory: tools/audit
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Detectors
        id: audit
        working-directory: tools/audit
        run: node audit.mjs

      # The review cards open full size. That is interactive, so audit.mjs
      # cannot see it -- its detectors measure a rendered page, and this only
      # exists after a click. It is also the kind of thing that breaks quietly:
      # a renamed class or a stray error in main.js leaves the cards looking
      # right and doing nothing, and nobody clicks their own testimonials.
      - name: Lightbox
        working-directory: tools/audit
        run: node lightbox.mjs

      # A photo a third party withdrew is reported, never fatal: blocking an
      # unrelated merge on a stranger's decision gets the check disabled rather
      # than the photo replaced. audit.mjs exits 0 for these and writes them to
      # $GITHUB_OUTPUT; the weekly hotlink-watch job is what chases them.
      - name: Flag withdrawn photos on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ROTTED: ${{ steps.audit.outputs.rotted }}
          ROTTED_BODY: ${{ steps.audit.outputs.rotted_body }}
        with:
          script: |
            const MARKER = '### Withdrawn photos';
            const rotted = Number(process.env.ROTTED || 0);

            // Find the note from a previous run, if any. Everything below either
            // updates it or clears it — a stale comment saying two photos are
            // dead after they have been fixed is worse than no comment, and the
            // obvious version of this step (skip when clean) leaves exactly that.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const mine = comments.find((c) => c.body.startsWith(MARKER));

            if (!rotted) {
              if (mine) {
                await github.rest.issues.updateComment({
                  ...context.repo, comment_id: mine.id,
                  body: [
                    MARKER,
                    '',
                    'Resolved — every photo on this branch resolves again.',
                    '',
                    '---',
                    '_Generated by [Claude Code](https://claude.ai/code)_',
                  ].join('\n'),
                });
              }
              return;
            }

            const body = [
              MARKER,
              '',
              `${rotted} hotlinked photo(s) no longer resolve, so the page renders a`,
              'fallback tile where the picture should be. This is not caused by this PR and does',
              'not block it — repoint the slot in the `IMAGES` table in `tools/build.py`.',
              '',
              process.env.ROTTED_BODY || '',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            if (mine) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
