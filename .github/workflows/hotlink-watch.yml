name: hotlink-watch

# Most photos on the site are still hotlinked to Unsplash, and a hotlink rots
# without warning: one had already been withdrawn upstream, and three places
# were rendering a sentence of alt text where the picture should have been. It
# reached a human reviewer instead of a check.
#
# PR checks do not close that gap on their own — they only run when someone
# opens a PR, and rot on a launched site is precisely what nobody notices during
# a quiet month. This runs weekly whether or not anyone is working, and files an
# issue naming the dead slot rather than turning a build red that no one reads.
#
# It becomes unnecessary the day the placeholders are replaced with Zac and
# Chad's own photography. Until then it is the only thing watching them.

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays, 09:00 UTC
  workflow_dispatch: # so it can be run on demand before a cutover

permissions:
  contents: read
  issues: write

jobs:
  check-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/audit/package-lock.json

      - name: Install the audit's browser
        working-directory: tools/audit
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check every photo
        id: audit
        working-directory: tools/audit
        run: node audit.mjs

      - name: Open or update an issue
        if: always() && steps.audit.outputs.rotted != '' && steps.audit.outputs.rotted != '0'
        uses: actions/github-script@v7
        env:
          ROTTED: ${{ steps.audit.outputs.rotted }}
          ROTTED_BODY: ${{ steps.audit.outputs.rotted_body }}
        with:
          script: |
            const body = [
              `${process.env.ROTTED} photo(s) referenced by \`IMAGES\` in \`tools/build.py\` no longer`,
              'resolve. The pages render a fallback tile where the picture should be.',
              '',
              process.env.ROTTED_BODY || '',
              '',
              'Fix by repointing each slot in the `IMAGES` table. A photo in `assets/img/`',
              'cannot rot; an Unsplash URL can. See `ASSETS.md` for what each slot needs.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'hotlink-rot',
            });
            if (open.length) {
              await github.rest.issues.update({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: 'Hotlinked photos have been withdrawn upstream',
                body, labels: ['hotlink-rot'],
              });
            }

      # Nothing is wrong any more, so stop the issue nagging.
      - name: Close the issue once every photo resolves
        if: always() && steps.audit.outputs.rotted == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'hotlink-rot',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: 'Every photo resolves again. Closing.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed',
              });
            }
